<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EditorSong</title>
</head>
<body>
<!-- Las partes con id="ui-..." las pinta React (src/ui/, React 18 + JSX compilado con Vite); los lienzos 3D son de three.js. -->
<header id="ui-top"></header>
<main id="layout">
  <section id="viewWrap">
    <canvas id="view" tabindex="0"></canvas>
    <div class="overlay tl" id="viewInfo">Escenario</div>
    <div class="overlay tr small" id="bandInfo"></div>
    <div id="ui-viewtools"></div>
  </section>
  <section id="monWrap">
    <canvas id="monitor"></canvas>
    <div class="overlay tl" id="monInfo">Monitor de programa</div>
    <span class="overlay br tag">PROGRAMA</span>
  </section>
  <aside id="ui-panel"></aside>
  <aside id="ui-kfside"></aside>
  <section id="ui-kfdock"></section>
  <section id="tlWrap">
    <div id="tlResize" title="Arrastra para cambiar la altura de la linea de tiempo"></div>
    <div id="ui-transport"></div>
    <div class="tlBox"><div id="ui-timeline"></div></div>
    <div class="tlHint muted small">Doble clic o <b>+</b>: anadir &middot; arrastrar: mover (Alt: libre; arriba/abajo: a otra escena) &middot; borde derecho: duracion &middot; Supr: borrar &middot; Ctrl+rueda: zoom &middot; Mayus+rueda: desplazar &middot; doble clic en un nombre: renombrar</div>
  </section>
</main>
<div id="ui-overlays"></div>
<datalist id="animNames"></datalist>
<div id="boot"><div class="spinner"></div><p>Cargando editor...</p></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
