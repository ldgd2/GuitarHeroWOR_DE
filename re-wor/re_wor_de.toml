# Guitar Hero: Warriors of Rock - Definitive Edition (re-wor)
# Configuracion editable a mano, desde el lanzador o desde el panel del juego.
# hotkeys: teclas del juego ("F8", "F11", "Backtick", "Insert", "P"...).
# input.backend: "sdl" (XInput + DirectInput + HID) o "xinput". Requiere reiniciar.
# mods: el orden es la prioridad (el primero gana si dos mods tienen el mismo archivo).

[dev]
auto_skip_intro = true
bridge_port = 8770
debug_build = false
log_file_opens = true
show_fps = false
target_refresh_rate = 144
uncapped_fps = false

[game]
language = 'es'

[graphics]
aniso = 0
async_pipeline_compile = true
backend = 'vulkan'
bloom = 0.0
blur = 0.0
brightness = 0.0
contrast = 0.0
crowd = 0
fxaa = false
glow = 0.0
grain = 0.0
letterbox = true
msaa2x = false
perf_detail = false
post_fx = false
preset = 0
refresh_hz = 240
render_target_path = 'rtv'
resolution = '1080p'
resolution_scale = 1
saturation = 0.0
sharpness = 0.69999998807907104
show_fps = true
texture_cache_mb = 512
upscale = 'fsr'
vignette = 0.0
vsync = false
window_mode = 2

[hotkeys]
achievements = 'F7'
console = 'Backtick'
debug_menu = 'F6'
fullscreen = 'F11'
panel = 'F8'
perf_overlay = 'F9'
settings = 'F10'
skip_intro = 'F'

[input]
backend = 'sdl'
