# Guitar Hero: Warriors of Rock - Definitive Edition (re-wor)
# Configuracion editable a mano, desde el lanzador (wormod) o desde el panel del juego. Atajos en [hotkeys].
# input.backend: "sdl" (XInput + DirectInput + HID) o "xinput". Requiere reiniciar.
# mods: el orden es la prioridad (el primero gana si dos mods tienen el mismo archivo).

mods = [
    { enabled = false, folder = "Again" },
    { enabled = true, folder = "_wtde_customs" },
    { enabled = false, folder = "takemeout" },
]

[dev]
log_file_opens = true
show_fps = false

[input]
backend = "sdl"
keyboard_gamepad = false
keyboard_guitar = true
keyboard_guitar_subtype = 6

[input.keys]
green = "F1"
red = "F2"
yellow = "F3"
blue = "F4"
orange = "F5"
strum_up = "Numpad1"
strum_down = "Numpad2"
start = "Return"
star_power = "Numpad8"
whammy = "Numpad0"
tilt = "Backspace"
nav_left = "Left"
nav_right = "Right"

[performance]
above_normal_priority = true
trace_probes = false

[hotkeys]
panel = "F8"
fullscreen = "F11"
perf_overlay = "F9"
settings = "F10"
console = "Backtick"
achievements = "F7"
skip_intro = "F"
