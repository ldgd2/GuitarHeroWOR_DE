<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canciones - DE Studio</title>
</head>
<body>
<!-- Las partes con id="ui-..." las pinta React (src/ui/, React 18 + JSX compilado con Vite); los lienzos 3D son de three.js. -->
<header id="ui-top"></header>
<main id="layout">
  <section id="viewWrap">
    <canvas id="view" tabindex="0"></canvas>
    <div class="overlay tl" id="viewInfo">Escenario</div>
    <div class="overlay tr small" id="bandInfo"></div>
    <div id="ui-viewtools"></div>
  </section>
  <section id="monWrap">
    <canvas id="monitor"></canvas>
    <div class="overlay tl" id="monInfo">Programa</div>
    <span class="overlay br tag">AL AIRE</span>
  </section>
  <aside id="ui-panel"></aside>
  <aside id="ui-kfside"></aside>
  <section id="ui-kfdock"></section>
  <section id="tlWrap">
    <div id="tlResize" title="Arrastra para cambiar la altura de la linea de tiempo"></div>
    <div id="ui-transport"></div>
    <div class="tlBox"><div id="ui-timeline"></div></div>
    <div class="tlHint small"><kbd>Doble clic</kbd> anadir &nbsp; <kbd>Arrastrar</kbd> mover (<kbd>Alt</kbd> libre) &nbsp; borde derecho: duracion &nbsp; <kbd>Supr</kbd> borrar &nbsp; <kbd>Ctrl</kbd>+rueda zoom &nbsp; <kbd>Mayus</kbd>+rueda desplazar &nbsp; doble clic en un nombre: renombrar</div>
  </section>
</main>
<div id="ui-overlays"></div>
<datalist id="animNames"></datalist>
<div id="boot"><div class="spinner"></div><p>Cargando DE Studio</p></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
